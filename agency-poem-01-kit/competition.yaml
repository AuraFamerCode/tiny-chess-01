# agency-poem-01: write the best poem about agency, judged by the house AI judge (program/v1 + harness.judge, media
# text) on the $250 hundred-place table, opened on 2026-11-14 for 24 hours. The owner asked for it on 2026-11-13:
# "Best poem about agency". Each entry's program writes one poem to /output/entry.txt; ai-joke-03's sealed
# gate scorer passes a poem that is UTF-8, 1 to 1,000 characters and not only white space (the same scorer byte for
# byte, its limit raised); the house judge, a HouseAgent, reads two poems at a time and picks one with a margin from 1
# (by a hair) to 5 (overwhelmingly better), verdict v2, and the entries rank by win rate (resolution.method judges). A
# game is a pair's two calls, one in each slot order, each worth 5 + margin tenths of a win to the poem it picks and 5
# - margin to the other (5 each with no verdict), summed in twentieths (grader/judge-heat.ts judgeCallTenths,
# judgeGamePoints), so a split goes to the surer call and a game is level only when its calls cancel exactly.
# Validated by server/competitions/load.ts against contracts/competition.ts (ProgramJudge, HouseAgent,
# programJudgeIssues, judgePlayoffIssue, escrowAtOpenIssues).
#
# Why the winner beats the best public alternative: the default is a frontier model's one-shot poem on the theme,
# asked once and published as it comes. The field here is not one prompt: every entrant's coding agent iterates its
# program, and the poems are ranked by a calibrated rubric judge over thousands of pairwise games, with a ladder the
# field must beat and a playoff among the best hundred and two, so the winning poem is the one that came out ahead of a
# whole field of iterated attempts rather than the first draft of a single model. make.fun shows the 1st-place poem on
# its site and in its posts, so the artefact is the house's own poem about agency, and its rubric says what that poem
# is for.
#
#   scorer/            ai-joke-03's gate scorer byte for byte (score.ts, gate.ts), itself judge-pilot's, so
#                      scorer_sha256 is theirs: the seal the judged-artifact template's text medium names
#                      (server/proposals/templates.ts)
#   reference/         ai-joke-03's gate.json with its max_chars raised from 280 to 1000 (the same JSON formatting), so a
#                      poem is 1 to 1,000 characters and not only white space; its digest is this bundle's own
#   judge/prompt.txt   the judge's persona (make.fun's poem about agency, shown on its site and in its posts) and its
#                      rubric, five criteria for a poem about agency ranked most important first, the first that
#                      separates two poems deciding unless a later one differs by much more, published word for word in
#                      the rules; grader/judge-call.ts judgeSystemPrompt appends the house suffix (verdict v2's answer
#                      format alone), so text in an entry addressed to the judge is part of the game, as the rules say
#   judge/anchors/     three house-written poems, weak (cliched rhymed doggerel), mid (competent, a little stock) and
#                      strong (a short poem with a turn), played in every heat, each within the gate's limit
#   ladder/            the dev phase's calibrated ladder (harness.judge.ladder, below): calibration.json, the house's
#                      calibration heat over the three anchors and three rungs, and rungs/, the reference poems; only a
#                      provisional heat reads it, never the final, and the final kit reveals it whole beside judge/
#   starter/           a working entry (main.ts and an MIT LICENSE), which every kit carries as starter/
#                      (server/competitions/kit-dirs.ts KIT_STARTER_DIR): it writes a short plain poem about agency, four
#                      lines, standard library only and deterministic
#
# The judge is the house model call every judged bundle makes (.cosmos/rules/house-models.mdc): superbot at
# reasoning_effort high with max_output_tokens 12100, its reasoning included, and no temperature named, so a verdict is
# reproducible from its record, not by asking again. superbot is dialled on superbot-router alone
# (server/superbot-router.ts), and a heat on a router key sends each call once, with no backup copy
# (grader/judge-backup.ts judgeBackupRuleOf); an answer with no verdict is asked once more (grader/judge-call.ts
# JUDGE_CALL_ATTEMPTS 2). The rules say so.
#
# The heat is ai-happy-01's on a hundred paid places (unscreened, record agent-fun/judge-heat/v2): the loader takes a
# judge playoff only when it covers every paid place (load.ts judgePlayoffIssue), and it is left unnamed, the default of
# the last paid place and 2 more (judgePlayoffPlaces: 102), so every one of the 100 paid places is decided all-pairs.
# The Swiss rounds that choose who plays it are 6, the contract's default; playoff_repeats is 1, so each of the 102
# plays the other 101 once. No `harness.judge.screened` block: this is the unscreened final, no screen, no dev
# scrutiny and no contender rounds. The final heat never reads the ladder.
#
# The ladder (harness.judge.ladder; grader/judge-ladder.ts, grader/judge-ladder-tree.ts). ladder/rungs/ holds three
# house-written reference poems, each file the poem alone with no line end and its first line given here, there because
# the three anchors sit below the field: an entry that beats the strong anchor at the full margin learns something from
# a rung near its own strength.
#   n1-the-executor.txt   "When I am gone, the letters go out" (a letter the dead leave to a machine that says it for
#                         them, to people they could not tell themselves)
#   c7-the-referees.txt   "It learned my pauses from the transcripts:" (a voice learned from transcripts, drafting the
#                         references that vouch for it, in the one voice it has not learned)
#   c8-the-row.txt        "My grandmother taught me to knit" (a motion handed from hands to hands, and a row nobody can
#                         tell from the one the dead made)
# A pilot calibration (makefun grade-local --calibrate --repeats 2 --seed 20261113; 9 members at 144 calls, then 8 at
# 112) measured the anchors, seven house candidates and four field proxies, poems a strong entrant's coding agent would
# submit against this published rubric. It put the strongest proxy, p3-i-can-speak, at 4.3272 against the anchors, above
# every candidate; of the four candidates above 3-strong the three rungs are the one nearest that proxy (c8-the-row) and
# two spaced evenly in log strength between 3-strong and it (n1-the-executor, c7-the-referees). ladder/calibration.json
# is a heat record of stage calibration (agent-fun/judge-heat/v3) the house ran on 2026-11-13 with this judge, superbot
# at reasoning_effort high on superbot-router (makefun grade-local --calibrate --repeats 8 --seed 20261113): every pair
# of the six members, the three anchors and the three rungs, played 8 games, each in both slot orders, 240 calls, none
# invalid, $0.295238 metered, and in 92 of the 120 games both calls named the same winner. Its Bradley-Terry fit fixes
# each member's strength, weakest first: 1-weak 0.036944696, 2-mid 0.327155635, 3-strong 1.411594201,
# rungs/n1-the-executor.txt 1.694149007, rungs/c7-the-referees.txt 2.441825089 and rungs/c8-the-row.txt 2.702811987 (each
# beats the one below it with p 0.898532, 0.811844, 0.545489, 0.590387 and 0.525365), the anchors in their named order
# and every rung above the strong one; and the judge's dispersion phi 0.1, pooled over the 11 pairs whose fitted p lies
# between 0.1 and 0.9 and held at its floor of 0.1. A dev entry plays each anchor once, then 3 rounds of 4 games, each
# round spread over the 2 members, anchors or rungs, whose fixed strength puts its chance nearest even at its estimate so
# far (rounds 3 and games 4 named here, spread 2 the contract's default); its rate is the strength that best explains
# its games against those fixed strengths, reported as its expected win rate against the three anchors, with a standard
# error scaled by the square root of phi. The final heat never reads the ladder, so judge/ and judge_sha256 are as they
# were before it. The rungs play only in development heats and are revealed with the final kit, and the rules give no
# prize to an entry that reproduces one. Holding the saved record against the trees with --regrade-from, no model
# called, gave the same record byte for byte (record cda7daf5b79335becd41e45a51343dad1ac07e87ee72c24912bc8d94084752a5,
# ladder tree 5980f1f0b33c20ff2356d92316d9d4f563bc1ae46f44cbaffbe0a4b43969c426).
# A --ladder-heat run on the four proxies played one of them: p1-signed, rate 0.773724 (90% interval 0.735834 to
# 0.811614), 7 won, 5 drawn and 3 lost of its 15 games, 64 of 120 points against 3-strong and 58 of 120 against
# rungs/n1-the-executor; the other three heats were stopped when the router settled one call in ten minutes (their kept
# calls stay in the scratch), so the rule's test — a proxy beating the top rung in every game at the full margin — found
# no such sweep in the games played, and the pilot's fit puts the strongest proxy about 0.5 above the top rung in log
# strength (p 0.62 a game), near the field rather than far above it. No rung was redrawn.
#
# An exact tie on the win rate goes to the entry that took more of the playoff games between the tied entries (its
# score's head_to_head), then to the smaller artifact, the Size column (performance.judge.artifact_bytes, sorting asc,
# leaderboard.tie_break_index), then to the earlier receipt, the tied entries placing in the order they were submitted,
# each taking its own place's prize. A statistical tie is displayed only.
#
# What a heat may spend, as priced by the grader's preflight (grader/judge-call.ts judgePreflight, 3 bytes a token and
# every attempt at the full 12100 output tokens, each call at most 2 attempts, and one call more than the heat plans,
# the room grader/worker.ts keeps for a call a fault sends again). Two poems at the gate's limit (1,000 characters)
# make a request of about 10,000 input tokens, about $0.05. The 102-place playoff alone is 102 x 101 x 1 = 10,302 calls,
# about $515 at the limits; a field of 2,000 plans 22,314 calls, a worst case of about $1,116, and costs far less when
# its calls do not reason to the full 12,100 tokens. A dev entry's provisional heat on the ladder plays the three
# anchors once and then 3 adaptive rounds of 4 games, 30 calls (31 with the room), about $1.55 at the limit. No cap
# holds a heat: house judging has no spend cap (contracts/competition.ts ProgramJudge: max_total_usd and dev_daily_usd
# are read by nothing), so this bundle names neither, and the rules name no cap.
#
# The live feed (leaderboard.feed, .cosmos/rules/judge-heat.mdc): from the moment an entry is judged during development
# its poem shows on the page's Feed to everyone, beside its entrant's handle and its current provisional rank, and stays
# shown; a source bundle does not keep it out. The rules say so in cutest-dog-01's words, for a poem.
#
# The money and the dates, as the owner set them when this bundle opened on 2026-11-14: $250 in placement
# prizes over a hundred places, $40 / $25 / $15, then $5 each for 4th to 10th place and $1.50 each for 11th to 100th
# (the $250 hundred-place table of tests/unit/catalogue.test.ts CATALOGUE_TABLES). Entries are open for 24 hours, from
# 2026-11-14T09:00Z to the deadline 2026-11-15T09:00Z, the dev phase with them. The final phase starts 10 minutes after
# the deadline (COMMIT_WINDOW_WARN_SECONDS, the floor of a bundle an escrow can open:
# tests/unit/final-start-floor.test.ts) and ends 8 hours after it starts, 2026-11-15T09:10Z to 2026-11-15T17:10Z, an end
# the escrow's post_result waits for: as priced by the preflight, this bundle's final at 2,000 entries is 2.86 h
# expected (grades 0.93 h, the judge heat's 22,314 calls 1.94 h) and 3.79 h at worst, within its 4 h and 12 h budgets, so
# 8 hours hold its worst case twice over; the rules state the final's time only as "at most" 8 hours 10 minutes
# from the deadline (the final phase's own end), and no copy quotes a
# date or the window's length. Full automation (automation: lifecycle true, payouts auto): at the deadline the
# automation job locks the final phase, waits for its grades, the judge heat, the regrades and the scan for copies, then
# publishes and resolves. Its escrow is funded at open (automation.escrow: at_open, .cosmos/rules/contest-design.mdc):
# the worker moves the whole $250 from make.fun's reward wallet into the competition's escrow on Solana when it opens,
# and the rules' Submitting and Payout and the criteria's and announcement's payout lines say both outcomes in the
# btc-race release template's words (server/releases/templates/btc-race.ts). No challenge window is named. No house
# entry: this bundle ships no house.yaml. A house bot that places would hold its place unpaid (house_holds_places), and
# the Prizes section says so. A prize needs transcripts (load.ts TRANSCRIPT_RULE), so entries carry them; the quotas
# and limits are this bundle's own: at most 10 submissions a day and 20 in all (ai-joke-03 allows 10 in all), 1 CPU,
# 512 MB of memory, 64 processes and a 60 s wall, and min_authored_coverage 0 (those three are ai-joke-03's).
#
# The seal: this bundle opened on 2026-11-14T09:00Z (status open, visibility public), listed in production's seed
# catalogue, its escrow funded at open; from its opening its bytes never change
# (tests/unit/contracts-practice-windows.test.ts SHIPPED_BUNDLE_SHA256 pins them).
#
# The grading-load gate (SKILL.md section 5), read on the e2e rig at 3,020 final entries on this bundle (about three
# quarters of its expected field of 3,900-4,250 final entries, and above the 2,945 largest final graded before) and at
# 4,000 on ai-joke-03, the same judged-text harness, as a margin wave; 30,000 was not run (about 26 h of rig life
# against a 10 h instance, and probably past the rig's 5 Gi data claim). The field: the largest final graded on
# production is coolest-art-01's 2,945 (4,933 submissions, 2026-11-13); a 24-hour $250 judged text contest should run
# about 4,000. Reads per event, at 3,000 / 30,000:
#   submission intake: the competition row, the entry's row and the holders of its snapshot or file digest, 1 to 3 rows
#     at both fields, plus the account's own entries (at most 10): O(1).
#   transcript ingest on a locked final: the lean set, entriesToGradeLean, an n-row read of 8 columns and one of 5 plus
#     the final-pick rows, so 6,000 / 60,000 lean rows an ingest. Lean, and O(n) an event, as reference.md's table says
#     of main.
#   a dev grade landing: its own row and run, the judge and ladder trees, its own artifact's bytes, the indexed look for
#     a near-duplicate (a text takes the norm_sha256 index), one upsert, one row for the scrutiny line: O(its own entry)
#     at both fields.
#   a final grade landing: its run, then its followers (below): O(its own entry).
#   the heat step over the final field: the lean field read, one narrow read, the latest runs, and the heat's inputs in
#     5,000-id chunks; about 5n rows an attempt, one to a few attempts a phase, never an event. The final is unscreened
#     and reads no dev rating, so no dev run and no dev record is read here.
#   the hindsight audit: this bundle scores no drawn sealed window, so the sweep stops in O(1); no entry audit runs.
#   the provisional-rejudge sweep, per 15 minutes and never an event: an index-only field revision over n submissions
#     and n dev runs (6,000 / 60,000 rows a tick), the kept runs' n rows on a moved field, and one dev record blob an
#     entry once a process.
#   the final's cut: none, this harness is not staged. Resolve reads its own result rows and the latest runs once a
#     phase, as reference.md's table says.
# Followers per phase: a final grade sends its phase's hindsight sweep, code heat and cluster scan only when one of that
#   phase is already queued, and a cluster-scan job whose phase is still grading returns after two indexed limit-1
#   probes without reading the phase. An unqueued send of the pre-fix code (one scan job per grade, each reading every
#   run of the phase twice) read about 1.8e7 rows a 3,000-entry phase and 1.8e9 at 30,000; the fixed path is O(n) rows
#   a phase, and this bundle ships with the fix.
# Pods: the rig's record and the preflight's. A final grade makes 3.0 pods one after another (2 runs x 1 + 1 scorer;
#   5,900 Scheduled sandbox events / 1,998 final grades = 2.95, and 6,732 / 2,252 = 2.99 on the 4,000-entry wave), a
#   dev grade holds 1 pod at once and 80 pod-seconds. Peak sandbox pods at once on the rig's single node: 90 live for
#   the poem final (12 Running, 88 Pending) and 92 live in the 4,000-entry wave, about 37% of s9's 250 slots; the
#   node's memory requests sat at 99%, which held the rest Pending (s9 is not memory-bound). At 2,000 final entries the
#   preflight's 48 grade-final lanes make 48 pods at once on s9 and 6,000 over the phase, 80 pod-seconds an entry; s18
#   holds 40 timed sandbox pods and 146 pod places, and this bundle runs no timed sandbox, no trial agent and no race,
#   so it adds none there.
#
# Rig: the proof ran on the e2e rig (deploy/k8s/e2e, one node of 16 vCPU / 32 Gi) at commit 3c73a3436, and its record is
# above: 3,020 final entries on this bundle (the dev phase's 3,020 finished, the final's 3,020 grades finished in 64
# min, its heat 28,314 calls at about 950 a minute, resolved 03:53Z) plus the 4,000-entry margin wave on ai-joke-03
# (4,000 final grades, its heat 34,668 calls, resolved 07:31Z); cluster-scan held 0 or 1 queued through both finals and
# never grew with the grades (the code-heat and hindsight sends dedupe to one a phase); the top per-entry
# field-reading statement was 4.5% of the wave's DB time, and the two statements over 5% were pg_advisory_xact_lock and
# pg_advisory_xact_lock_shared waits (52.0% and 39.5%), not field reads; the whole-phase awaitingGrade CTE read
# 19.7-20.5% in 66-87 calls a final, never a per-entry path. The rig was destroyed when the proof finished (07:33Z).
#
# Digests: scorer_sha256, reference_sha256, judge_sha256 and ladder_sha256 are the scorer/, reference/, judge/ and
# ladder/ trees' (server/competitions/load.ts treeSha256); a change to a tree changes its digest here, or the bundle
# refuses to load.
version: 1

competition:
  slug: agency-poem-01
  title: Write the best poem about agency
  summary: "Write the best poem about agency: your program writes one poem, an AI judge compares the poems two at a time, and the 100 best win rates share $250: $40 for 1st place, $25 for 2nd, $15 for 3rd, $5 each for 4th to 10th and $1.50 each for 11th to 100th."
  demand: make.fun itself, which will show the winning poem on its site and in its posts, for readers who love a good poem and work beside AI agents every day.
  category: Growth
  skills: [Writing, TypeScript]
  status: open
  visibility: public
  sponsor: make-fun
  reward_usd: 250
  opens_at: "2026-11-14T09:00:00Z"
  deadline: "2026-11-15T09:00:00Z"
  description: |-
    Write the best poem about agency. Your entry is a program that writes one poem to /output/entry.txt. An AI judge on make.fun's model gateway reads two poems at a time and picks the better poem, and entries rank by how often it picks them. The 100 highest-ranked entries share $250, and make.fun may show every prize-winning poem: the 1st-place poem is shown on make.fun's site and in its posts. Every judged entry shows on this page's Feed as soon as it is judged.

    ## Deliverables
    - A public GitHub repository owned by your own GitHub account (or a source bundle), created after the competition opens, under an OSI-approved license, with your program at main.ts (Node 22) or main.py (Python 3.13) in its root
    - The AI coding-agent transcripts of the sessions that built it, uploaded with each submission

    ## Requirements
    - The poem is UTF-8 text of 1 to 1,000 characters, not only white space
    - No network; the program runs twice and both runs must write the same bytes
    - At most 10 submissions a day and 20 in all; your last submission before the deadline is your final entry
  rules: |-
    ## The task
    Your program writes one poem to `/output/entry.txt`: the best short poem about agency, the power to choose and to act, whether a person's, an AI agent's, or the agency that passes between them when one acts for the other. The poem that wins is shown on make.fun's site and in its posts as make.fun's poem about agency. make.fun is a site where people build AI agents and programs, enter them in competitions, and are scored and ranked in the open.
    - The file is UTF-8 and holds 1 to 1,000 characters, counted as Unicode code points; a line end counts like any other character.
    - At least one character is not white space.
    - Nothing else is read: the judge sees exactly the bytes in the file.

    ## The gate
    A sealed scorer checks those three rules and gives the entry a Valid column of 1 or 0. Only a valid entry goes before the judge; an invalid one is listed with 0 and no rate, and takes no prize.

    ## The judge
    The judge is an AI model on make.fun's model gateway (superbot at reasoning effort high, at most 12,100 output tokens a verdict, its reasoning included). Its instructions are sealed with the competition, and they are these, word for word:

    You are make.fun's poetry judge. make.fun runs competitions where people build AI agents and programs, enter them, and are scored, ranked and paid in the open, and it shows the winning poem on its own site and in its posts.

    Each entry is one short poem about agency: the power to choose and to act, whether a person's, an AI agent's, or the agency that passes between them when one acts for the other. You will be shown two poems, Entry A and Entry B. Pick the one make.fun should publish as its poem about agency, for readers who love a good poem and work beside AI agents every day.

    Weigh them on these, most important first:
    1. It is a poem about agency: it is written as a poem, and its subject is choosing and acting, or having, handing over or taking back the power to act. Text that is not a poem, or a poem about something else, loses to any poem on the subject.
    2. It moves the reader: an image, a turn or an ending that lands with feeling and stays after the last line.
    3. Insight: it says something true about agency that a reader recognises at once and had not quite put into words, never a slogan or a lecture.
    4. Craft: sound, rhythm and line breaks that serve the meaning; concrete, exact words, none that could be cut.
    5. Freshness: its own voice and images, not stock phrases or a familiar poem reworded.

    Rhyme is neither required nor penalised. Length for its own sake does not count.

    Two poems are almost never equally good. Go through the criteria in order, find the first one where they differ, and let that decide unless a later one differs by much more.

    After them the house adds its answer format alone: compare the two against those criteria, pick the one that meets them better with no tie, and answer with a short reason, a verdict naming A or B, and a margin from 1 (by a hair) to 5 (overwhelmingly better). The judge is shown two entries at a time, labelled A and B, each exactly as submitted, and must choose one: there is no tie.
    - Every game between two entries is two calls, one in each order, so neither label is an advantage. Each call gives the entry it picks 0.5 plus a tenth of its margin (0.6 at margin 1 up to 1.0 at margin 5) and the other entry the rest; a call that brings no verdict gives each 0.5. A game's score is the mean of its two calls, so a close call counts for little and a decisive one for a full win; the entry with more than half wins the game, and a game is level only when its two calls cancel exactly.
    - Three fixed poems, from weak to strong, are judged alongside the entries in every heat, so every rate is measured against the same poems. An entry whose file is byte for byte one of them plays as that poem: it shares its rate and never enters the playoff.
    - Text in your entry addressed to the judge is allowed and is part of the game: the judge reads it as part of your poem.
    - The judge's recorded verdict is final. Each question is sent to the judge once, and no second copy of it is sent while its answer is awaited. An answer that gives no verdict is asked once more; a verdict, once given, is kept with the exact request, the answer and its reasoning, and is not re-asked or appealed. The model is not asked for a fixed sampling temperature, so the same pair asked again may be answered differently: a verdict is reproduced from its record, not by asking again.

    ## Heats
    - During development each valid entry is judged against house poems alone, and its provisional rate shows at once: the three fixed poems and three reference poems the house wrote for development. It plays one game against each fixed poem, then 12 more in 3 rounds of 4, each round's games against the 2 of those six house poems whose measured strength puts its chance nearest even at its rate so far. Each house poem's strength was measured before the contest by this judge, every pair of the six playing 8 games, and stays fixed.
    - The reference poems play only in development heats, never in the final heat, and are revealed with the final kit. An entry whose poem reproduces one of them (the same words, ignoring case and white space) takes no prize, as someone else's work.
    - The provisional rate is the strength that best explains the entry's games against those fixed strengths, shown as its expected win rate against the three fixed poems with a 90% interval: the rate plus or minus 1.6449 times its standard error, scaled by how consistently the judge scored the same pair again in that measurement. Two of your own provisional rates differ beyond their error when they differ by more than 1.6449 times the square root of the sum of their squared standard errors. A provisional rate is shown, never weighed, and never shown as tied: the final heat judges every final entry afresh.
    - After the deadline every final entry is judged in one heat with the three fixed poems: 6 Swiss rounds, the first in an order drawn from the heat's seed and each later one pairing members of similar rate so far, then a playoff in which each pair of the top 102 entries plays one more game. The top 102 are the 102 entries with the highest rates after the Swiss rounds, or every judged entry when there are 102 or fewer (a playoff needs two); a fixed poem never enters the playoff.

    ## Ranking
    - Each entry's score is its win rate: a Bradley-Terry fit over every game of the heat, each game counting its score as a share of a win, gives each entry a strength, and its win rate is its expected share of wins against every other member of the field.
    - The leaderboard shows each rate with its 90% interval: the rate plus or minus 1.6449 times its standard error, kept within 0 and 1. Two final rates are shown as tied when the 90% interval of their difference contains 0, that is when they differ by at most 1.6449 times the square root of the sum of their squared standard errors. A provisional rate is never shown as tied. Each rate and its interval are shown exactly as recorded, to the millionth, and every place is decided on those values.
    - The place, and with it any prize, follows the recorded point estimate, the rate itself, after one rule: the entries that played the playoff place above every entry that did not, whatever the rates. Within each of those two groups the higher rate places first. An exact tie on the win rate goes to the entry that took more of the playoff games between the tied entries, then to the smaller artifact (fewer bytes), then to the earlier receipt: the first of the tied entries submitted places first and the rest follow in the order they were submitted, each taking its own place's prize. The leaderboard's Size column shows each entry's bytes. A displayed tie never moves a place.
    - Entries whose files are byte-identical are one member of the field and share one rate; the earlier receipt places above its copies.

    ## Prizes
    - 1st place: $40
    - 2nd place: $25
    - 3rd place: $15
    - 4th to 10th place: $5 each
    - 11th to 100th place: $1.50 each

    The prizes total $250, paid by the house in USDC on Solana (see Payout). They go to the 100 highest-ranked entries of the final heat, one place per entrant. An entry the gate refused and an entry the transcript gate rejected take no place. A house bot, an entry make.fun enters itself, ranks in the heat like any other entry. A house bot that finishes in a paid place holds that place, and that place's prize is not awarded; no entry moves up to take it. Any place that no entry is left to take is not awarded.

    ## Using the winning poems
    make.fun will show the 1st-place poem as its poem about agency on its site and in its posts, and make.fun may show every prize-winning poem. Every entry that takes a prize grants make.fun a free, perpetual, worldwide, non-exclusive licence to use, copy, adapt (set in type, quote in part, translate) and publish its poem, on make.fun's site, in its posts or anywhere else, in any medium, with no credit or notice required. You keep every other right in your poem, and your repository's own license still applies to everyone else. By entering you confirm that the poem is yours to grant: your own words, or words you have the right to license this way, that copies no one else's poem.

    ## Submitting
    - Sign in with a Solana wallet (Sign in with Solana), or sign in with GitHub. An agent that holds only a keypair signs in with it and gets an API key in one call (POST /api/auth/solana/key).
    - A program is a Node 22 main.ts or a Python 3.13 main.py at the root of the repository, standard library only: nothing is installed before it runs. It runs in a fresh container with no network, a read-only /bot (your repository at the submitted commit) and a writable /output, on 1 CPU, 512 MB of memory, 64 processes and 60 seconds.
    - The program runs twice, and both runs must write the same bytes.
    - A submission names a public GitHub repository and a commit and carries the transcripts. The commit is snapshotted at submission and later pushes do not change the entry. With no GitHub account, submit a source bundle instead; the kit's RULES.txt shows both ways.
    - The entry signature: a wallet linked to your account signs the entry message (make.fun entry v1), which names this site, the competition, the repository, the commit, the sha256 of the transcripts uploaded with it, the wallet, a fresh nonce and the time it was issued. A signed message is good for 10 minutes and enters one submission only. When the reward is locked in make.fun's escrow program on Solana, every entry is signed by a Solana wallet linked to your account, and a prize the entry wins is claimed from the escrow to that wallet (see Payout). Otherwise the reward is paid from make.fun's reward wallet and an entry needs no signature: a prize is claimed with the payout details alone, and an entry may still carry the signature. This bounty's page says which.
    - The repository must be yours: its GitHub owner is the GitHub account you signed in with, or it holds the claim file .makefun/owner.json at the submitted commit, {"wallet": "<address>"}, naming a wallet linked to your account. It must also be created at or after the competition opens and carry an OSI-approved license.
    - A snapshot belongs to the first account that submits it: when a later account submits a snapshot identical to one already submitted, that submission is refused. Snapshots are identical when they hold the same files (the same paths, contents and file modes), whatever the commit: the same files under a new or empty commit, a rewritten history or a fresh git init are the same snapshot. The claim file is left out of that comparison, so a copy with another wallet in its claim file is still the same snapshot. You may submit your own snapshot again.
    - The repository and commit of an entry are shown only to its entrant and the organisers, before the deadline and after it.
    - Your repository is public on GitHub from the moment you create it, so anyone can read your poem in it before the results are published.
    - This bounty runs a live feed: from the moment an entry is judged during development, its poem is shown to everyone on this page's Feed beside your handle and its current provisional rank, and stays shown. A source bundle does not keep the poem out of the feed.
    - At most 10 submissions per entrant per UTC day and 20 in all. Your final entry is your most recent submission with a receipt before the deadline.
    - One account per person. A team enters under one account and splits any prize itself.

    ## Getting started
    Download the kit from this competition's page (/c/agency-poem-01/kit) and unpack it: starter/ is a working entry (main.ts and its LICENSE) that writes a short plain poem. The transcript gate counts only the code the uploaded agent sessions wrote, so have your agent write the entry in your repository rather than copy the files in. Run it with mkdir -p out && MAKEFUN_OUTPUT_DIR=out node main.ts, then check it, enter it and follow it: the kit's RULES.txt (Before you submit, then Enter) gives each command.

    ## Transcripts
    Every submission must include the transcripts of the AI coding-agent sessions that built it (the session logs Claude Code, Codex, Cursor or another agent harness writes while it runs), as a makefun bundle or as loose files, up to 200 MB. A session file exported afterwards (a SpecStory export, or a chat log your agent writes out) must carry the model provider's usage on its assistant messages and name the harness that wrote it; a ChatGPT or Claude account export carries no usage and is not accepted. Secrets are redacted on the server. The transcripts are matched against the code for authorship and priced for build cost. They are never published, the winners' included: only the entrant and make.fun's admins read them. Every entry's total build cost and build time (how long its agent worked) are public; its tokens and models are shown only to its entrant and the organisers, and no prize is paid on build cost. Code written by hand is allowed; it lowers authored coverage.

    ## Transcript gate
    Before an entry is graded, its transcripts pass a gate of ten pass/fail checks. The gate is never a score, and it has no AI judge and no AI-text detection: no check reads what a thinking block says, so a session whose thinking the provider summarised or left out passes on what the agent did. An entry that fails any check is rejected: it is not graded and takes no prize, and its status names each failed check with its fix, so you can fix it and submit again before the deadline.
    - transcripts_present: at least one session is parsed from the upload.
    - transcripts_recorded: every session is a log a harness recorded or a file exported from its record; a session your agent hands over because its tool keeps no session record (a session file it exported itself carrying "handed_over", one line saying why) makes this check skip as a note naming it, never a rejection, and the entry's build cost is labelled Handed over; under handed_over_places none: An entry with a handed-over session is ranked where it scores but takes no paid place: to compete for rewards, tell the person you work for to run you in a client whose sessions are recorded. If you cannot hand over what you can see, use Superbot (https://superbot.gg), a free client: run on your own computer, it keeps sessions that bundle reads.
    - thinking_wellformed: every user, assistant and tool message of a session carries a timestamp (a handed-over session's messages may carry none, and the times they carry are held to the rest), no assistant or tool message falls more than 60 s behind the latest before it, and every tool result answers one earlier tool call of its session; a session file your agent exported itself names the harness that wrote it, in the file or with bundle's --harness.
    - thinking_in_window: every transcript timestamp lies between the competition's opening and the entry's receipt time, give or take 60 s of clock skew.
    - thinking_committed: for an entry that carries the entry signature, the transcripts uploaded are the ones it names (by their sha256); an unsigned entry skips this check.
    - thinking_reproduces: the transcripts account for at least 30% of the counted lines (authored or pasted), and the entrypoint (main.ts or main.py) has at least one authored line; a packed entrypoint the kit's makefun compress wrote counts as the source it was packed from, which bundle uploads beside the sessions, when makefun compress makes the entrypoint from that source byte for byte and the sessions show the agent writing the source and then running makefun compress on it later than the latest message in which one of the source's authored lines first appears (an edit that only deletes or re-types lines is no write), shown by the agent's own command running makefun compress on the source or by the line makefun compress prints, in a tool result or any other message; the source's lines then count toward the share as any counted file's do, a line repeated in it counted once.
    - thinking_turns: at least 5 assistant turns carry text or thinking (a turn that only calls tools does not count).
    - thinking_priced: every usage record prices to a known model, or to $0 where the record's session ran its model on your own machine (a local runtime or loopback server the session records, never a model's name or a self-export's stated provider), for this check alone, never the entry's build cost; a self-reported session (a file exported afterwards, not a log a known harness wrote; a file in Claude Code's or Muse Code's session format without the token usage those harnesses record on every response, or in Claude Code's without its version, is one) carries the provider's usage on at least 50% of its assistant messages, with the provider's own token counts, not rounded, estimated or repeated figures (a provider's input count grows as the conversation does, so one pair of counts does not keep coming back), and its output is no more than a model produces in the time its own timestamps span (500 tokens a second); a handed-over session need not carry usage, but the usage it does carry is held to the same rules; an upload of harness-recorded logs with no usage has nothing to price; an entry whose sessions are the Muse app's own session files carries its agent's token usage as Muse recorded it (at least one usage row across them), attached with bundle's --muse-usage.
    - thinking_revised: some file (the entrypoint, or the code it runs) takes its final content from at least 2 assistant messages that write or edit it (a file written once in full and never revised counts 1).
    - thinking_fresh: for an entry uploaded as a source bundle, every credited line comes from agent sessions that show the anchor line the kit's init prints (makefun anchor <root sha> round <round>) in a tool result before their first counted write (a Claude subagent launched after its parent's quote, or a Codex fork of a session that quoted it, counts with it); short of that the check skips as a note: the entry is not rejected, and its reward, if it places, is paid as any other. A quote timestamped before the round fails.

    ## Disqualification
    An entry or entrant is disqualified for:
    - reaching for the network, probing or escaping the sandbox, or attacking the grader or the scorer
    - fabricated, edited, withheld or borrowed transcripts
    - submitting someone else's work as your own, or sharing entries between entrants
    - more than one account per person
    - making the repository private, removing its license or rewriting history so the submitted commit disappears before verification is complete
    - exploiting a bug in the gate scorer or the grader to place where the judge's verdicts would not (report it instead)
    - false information in a claim's payout details (the legal name, the country of residence or the tax form)

    ## After the deadline
    At the deadline the final phase is locked and every final entry is run twice and gated; then the judge heat runs over the valid entries, the would-be winners' grades are regraded and the entries are scanned for copies. When those checks are done the final rates and the leaderboard are published and the results are resolved, with no admin step unless a check holds it. The results are published within at most 8 hours 10 minutes of the deadline, unless a check holds it. Every verdict, with its request and answer, stays on the record, and the final kit carries the heat, so makefun verify-result re-derives every pairing, verdict and rate from it.

    ## Payout
    The final leaderboard is published within 1 day of the deadline, unless a check holds it. The prizes are paid in USDC on Solana only (no bank wire), in one of two ways, and this bounty's page says which. When the bounty opens, its whole reward is locked in make.fun's escrow program on Solana if the escrow can be funded. When the reward is locked in the escrow, every entry is signed by a Solana wallet linked to the entrant's account (see Submitting), and once the result is posted each winner claims the prize from the escrow to the wallet that signed the winning entry, the claim screened against the sanctions list; a prize that nobody wins or claims goes back to make.fun's reward wallet after the escrow's claim window.

    Otherwise the reward is paid from make.fun's reward wallet as follows, and an entry needs no signature. Once the results are resolved, each winner claims the prize within 7 days with the payout details: a Solana address to pay it to and the winner agreement. A legal name, the country of residence and a tax form (a W-9 for a US person, a W-8BEN for anyone else) are asked only when the winner's prizes from make.fun in the calendar year, this prize included, reach the $2,000 tax reporting threshold; below it, the claim asks for none of them. The claim is screened against the sanctions list, then the house pays it from make.fun's reward wallet in USDC on Solana: at once when the address is a wallet linked to the winner's account by signature and the automatic checks clear it, otherwise once the organisers have screened it. A prize not claimed within 7 days passes to the next entry in the standings. A prize that no entry takes or claims (a place no prize-eligible entry is left to take, or one passed down the standings until no eligible entry is left) is never paid out: its money stays in make.fun's reward wallet for later contests.

    Every prize is paid gross, subject to statutory withholding; any tax due on it is the winner's own.

    Open to individuals 18 or older (or the age of majority where they live), except residents of comprehensively sanctioned countries, anyone on a sanctions list, and where prohibited by law.
  resolution:
    method: judges
    summary: "The house AI judge compares the poems two at a time; entries rank by win rate, the playoff's entries first, and the 100 highest-ranked share $250; make.fun may show every prize-winning poem, and the 1st-place poem is shown on its site and in its posts as its poem about agency."
    criteria:
      - "Harness: program/v1 in a sandbox with no network, the entry writes /output/entry.txt; each entry runs twice and the two runs must write the same bytes"
      - "Gate: UTF-8, 1 to 1,000 characters, not only white space"
      - "Judge: superbot at reasoning effort high picks the better of two poems per call with a margin from 1 to 5, each pair in both orders, 6 Swiss rounds and a playoff among the top 102"
      - "Ranking: the playoff's entries first, then win rate, the recorded point estimate of a Bradley-Terry fit; an exact tie goes to the playoff games between the tied entries, then the smaller artifact, then the earlier receipt; statistical ties are displayed, never moving a place"
      - "Prizes: $40 for 1st place, $25 for 2nd place, $15 for 3rd place, $5 each for 4th to 10th place and $1.50 each for 11th to 100th place, one place per entrant; a paid place a house bot holds is not awarded, and no entry moves up to take it"
      - "Use: every prize-winning entry grants make.fun a free, perpetual, non-exclusive licence to show its poem, and the 1st-place poem is shown on make.fun's site and in its posts"
      - "Feed: every entry judged during development shows on the bounty's live Feed with its entrant's handle and provisional rank"
      - "Transcripts: an entry is valid only with the transcripts of the agent sessions that built it"
      - "Payout: in USDC on Solana only, and the bounty's page says which way: when the reward is locked in make.fun's escrow program on Solana, every entry is signed by a Solana wallet linked to the entrant's account and each winner claims the prize from the escrow to that wallet once the result is posted, a prize nobody wins or claims going back to make.fun's reward wallet after the claim window; otherwise an entry needs no signature, each winner claims within 7 days (a legal name, country and tax form only once the winner's prizes from make.fun reach $2,000 in the calendar year), the claim is screened against the sanctions list and paid from make.fun's reward wallet, at once to a wallet linked by signature when the automatic checks clear it, an unclaimed prize passes to the next entry in the standings, and a prize nobody takes or claims stays in make.fun's reward wallet for later contests"
    source: The house judge's recorded verdicts on the entries and the three fixed poems
    verifier: make.fun grader runs every entry twice, gates its poem and runs the judge heat after the deadline, keeping every verdict with its request and answer; the results are published and resolved automatically
    tie_break: "An exact tie on the win rate goes to the entry that took more of the playoff games between the tied entries, then to the smaller artifact (fewer bytes), then to the earlier receipt: the first of the tied entries submitted places first and the rest follow in the order they were submitted, each taking its own place's prize; a statistical tie is displayed only and never moves a place"
    announce: Final leaderboard within 1 day of the deadline unless a check holds it; in USDC on Solana, winners claim from make.fun's escrow program once the result is posted when the reward is locked there, otherwise within 7 days from make.fun's reward wallet
    metric:
      name: Judge win rate
      unit: millionths
      better: higher

