# Full auto (the header): the lock, the grades, the judge heat, the publication and the resolve; autopay. Its escrow is
# funded when it opens (escrow: at_open), as the btc-race release template's is: payouts auto then pays from the reward
# wallet only when that escrow was never funded (server/competitions/load.ts escrowAtOpenIssues, escrowPayoutsIssue).
automation:
  lifecycle: true
  payouts: auto
  escrow: at_open
