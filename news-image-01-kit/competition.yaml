# The calibration's three reference images, the dev ladder's rungs (ladder/rungs/, under harness.judge.ladder's seal),
# are drawn the same way from these: r1 "A clean modern news infographic with the header "THE WORLD ON 13 NOV 2026"
# across the top and four illustrated tiles in a 2x2 grid, each with one short bold label: "US Senate summons Huang &
# Lutnick" (a Senate hearing room with two empty witness chairs), "Zelensky meets US envoys" (a round table with
# Ukrainian, US and EU flags), "Iran claims strike on US radar in Bahrain" (a radar dome on a desert coast under a
# missile streak), "FBI: N. Korea's $400m crypto hack" (a webcam screen with a masked figure and falling coins). Crisp
# flat illustration, balanced layout, restrained newsroom palette, all text spelled exactly as given, large and
# perfectly legible."; r2 "A striking illustrated front page titled "FRIDAY 13 NOVEMBER 2026: THE WORLD TODAY", with a
# glowing globe at the centre and six vivid vignettes around it, each with one short bold label: "Senate summons
# ex-Nvidia CEO" (an empty witness chair with a leather jacket), "Zelensky meets US envoys" (a handshake over a table
# with flags), "Drone hits Russian warship" (a smoking warship in a grey Baltic sea), "Iran claims strike in Bahrain" (a
# radar dome under a missile streak), "FBI: N. Korea $400m crypto hack" (a masked face on a video call), "Kane breaks
# England caps record" (a footballer in white raising his arms). Bold editorial illustration, strong composition with
# the globe as focal point, rich but restrained colour, every label spelled exactly as given, large and legible."; r3 "A
# masterful magazine-cover-style montage titled "13 NOV 2026" in large bold letters at the top: a dramatic illustrated
# night-side globe at the centre lit by city lights, ringed by six crisp cinematic vignettes, each joined to its place
# on the globe by a thin glowing line and carrying one short bold label: "US Senate summons ex-Nvidia CEO", "Zelensky
# meets US envoys", "Drone strikes Russian warship", "Iran claims strike on US radar", "FBI: N. Korea $400m crypto
# hack", "US: record 483,200 deportations". Cinematic lighting, rich harmonious palette, crisp clean editorial
# rendering, one clear focal point, every label spelled exactly as given, large and perfectly legible." They sit above
# the mid anchor, near the field's strength, so an entry that beats the strong anchor at the full margin still learns
# something from its provisional heat (.cosmos/rules/contest-design.mdc). Each image keeps the name it was drawn for.
#
# The ladder (harness.judge.ladder; grader/judge-ladder.ts, grader/judge-ladder-tree.ts). ladder/calibration.json is a
# heat record of stage calibration (agent-fun/judge-heat/v3) the house ran on 2026-11-13 with this judge, superbot at
# reasoning_effort high on superbot-router (makefun grade-local --calibrate --repeats 8 --seed 20261113): every pair of
# the seven members, the four anchors and the three rungs, played 8 games, each in both slot orders, 336 calls, none
# invalid, $0.542 metered, and in 160 of the 168 games both calls named the same winner. It ran in five attempts on key
# labels makefun/news-image-01/judge/local/1 to /5 (one router key, none minted), each the calibration's own resume
# keeping the calls already settled (239, then 248, 274, 296 and all 336), every request over HTTP/1.1 (a preload: this
# Mac's Node 26 fetch met HTTP/2 stream errors on ~1 MB image requests in coolest-art-01's calibration). The first two
# ran 16 calls in flight and were stopped by the house: the owner's rule of 2026-11-13 for judging off production, "we
# should never be doing this kind of judge volume on dev, totally unnecessary. like 1% of this volume max maybe
# concurrently on dev at a time", so the last three sent one call at a time, one calibration at a time across the day's
# image bundles; the third and the fourth each stopped when a 200 answer's body was cut off (ECONNRESET), and the fifth
# finished, $0.571 metered over every attempt. Holding the saved record against the trees and the rungs with
# --regrade-from, no model called, gave the same record byte for byte. Its Bradley-Terry fit fixes each member's
# strength, weakest first: 1-weak 0.0160, 2-plain 0.0380, 3-mid 0.1007, 4-strong 1.4795, rungs/r1 4.4202, rungs/r2
# 4.5926 and rungs/r3 6.6773 (each beats the one below it with p 0.704, 0.726, 0.936, 0.749, 0.510 and 0.592), the
# anchors in their named order and all three rungs above the strong one; and the judge's dispersion phi 0.1, pooled over
# the 9 pairs whose fitted p lies between 0.1 and 0.9 and held at its floor of 0.1. A dev entry plays each anchor once,
# then 2 rounds of 4 games, each round spread over the 2 members, anchors or rungs, whose fixed strength puts its chance
# nearest even at its estimate so far (rounds 2, games 4, spread 2, the contract's defaults, so none is named here); its
# rate is the strength that best explains its games against those fixed strengths, reported as its expected win rate
# against the four anchors, with a standard error scaled by the square root of phi. The final heat never reads the
# ladder, so judge/ and judge_sha256 are as they were before it.
