#
# What a heat may spend, as priced on 2026-11-13 by the grader's preflight of that day (grader/judge-call.ts
# judgePreflight, which prices an image by its pixels, judgeImageTokens: superbot is no one vendor's id, so the dearest
# of the three vendors' rules, 1120 input tokens at 512x512 on this model and 1369 at 1024x1024, the rest of a body at 3
# bytes a token, and every attempt at the full 12100 output tokens; each call at most 2 attempts, and one call more than
