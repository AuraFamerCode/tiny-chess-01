# place (load.ts judgePlayoffIssue), and it is left unnamed, the default of the last paid place and 2 more
# (judgePlayoffPlaces: 102), so every paid place is decided all-pairs among the 102. The Swiss rounds only choose who
# plays that playoff: 6, the contract's default and coolest-art-01's. playoff_repeats is coolest-art-01's 1: each of the
# 102 plays the other 101 once. The judge is coolest-art-01's, the house model call every judged bundle makes: superbot
# at reasoning_effort high with max_output_tokens 12100, its reasoning included, and no temperature named, so a verdict
# is reproducible from its record, not by asking again; a heat checks before it starts that the model reads images
