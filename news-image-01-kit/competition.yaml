# news-image-01: one image that sums up the world's news of Friday 13 November 2026, judged by the house AI judge
# (program/v1 + harness.judge, media image), coolest-art-01's judged image bundle on a one-day news subject, the owner's
# second image contest of 2026-11-13, on a new $250 hundred-place table. The owner, 2026-11-13: "how about make an image
# that makes the AI judge happy as one? And then we'll do another that's make an image that summarizes the global news
# of today as another one. And so both of those, we can stagger their release by like maybe 4 hours between each of
# them. And then the first one can just go live whenever. And both can be $250 bounties, where the top prize is like
# $50, and then the rest of the money is distributed across like the top 100 entrants for both. And maybe even another
# one could be make an image that makes the AI hungry. Maybe not even makes the AI hungry, but just make food images,
# like the best looking food image. That would also be another one we could stagger out." Each entry's program writes
# one image to /output/entry.png; coolest-art-01's sealed gate scorer passes a whole PNG or JPEG of at most 1 MiB and
# 1024x1024 pixels; the house judge, a vision HouseAgent on superbot-router, looks at two images at a time and picks one
# with a margin from 1 to 5 (verdict v2), and the entries rank by win rate over those matches (resolution.method
# judges). A game is two calls, one in each order, each worth 5 + margin tenths of a win to the image it picks and 5 -
# margin to the other (5 each with no verdict); the game's score is the two summed, in twentieths (grader/judge-heat.ts
# judgeCallTenths, judgeGamePoints), and the Bradley-Terry fit takes each game's score as a share of a win. The day's
# news is the events that happened, or were first reported, on 13 November 2026 in any time zone; the deadline falls
# after that day has ended everywhere on Earth (midnight at UTC-12 is 2026-11-14T12:00Z). The judge has no news feed and
# is not told what happened that day: it judges the two images in front of it by what a careful picture editor can tell
# from them, as news-summary-01's judge does its texts, and the prompt and the rules say so. No public picture of a
# day's news is a contest's bar here: the winner is make.fun's own picture of that day, shown on its site and in its
# posts, and the rules grant make.fun a licence to show every prize-winning image. Validated by
# server/competitions/load.ts against contracts/competition.ts (ProgramJudge, HouseAgent, programJudgeIssues,
# judgePlayoffIssue, escrowAtOpenIssues); tests/unit/comp-news-image-01.test.ts holds the figures below in step with
# this file and runs the starter through the grader's own executeProgram and scoreProgramWithChecks.
#
# Every key but the subject's text, the money, the dates and the judge and ladder seals is coolest-art-01's, and every
# public sentence is coolest-art-01's with an image of the day's news for a piece of art, but for the news day's framing
# (news-summary-01's: the day in any time zone, the deadline after it, no news feed, the house images drawn early in the
# day), the hundred-place table and its 102-place playoff, and today's transcript gate lines.
#
#   scorer/            coolest-art-01's gate scorer byte for byte, itself cutest-picture-01's, cutest-cat-01's and
#                      makefun-sticker-01's (score.ts, gate.ts: the magic bytes, the dimensions, the size and the
#                      file's structure), so scorer_sha256 is theirs, the seal the judged-artifact template's image
#                      medium names (server/proposals/templates.ts)
#   reference/         coolest-art-01's gate.json byte for byte, {max_bytes: 1048576, max_width: 1024, max_height:
#                      1024}, so reference_sha256 is coolest-art-01's
#   judge/prompt.txt   the judge's persona (make.fun's judge of one-day world news images, its winner shown on its site
#                      and in its posts) and its rubric, five criteria ranked most important first, the first that
#                      separates two images deciding unless a later one differs by much more, published word for word
#                      in the rules; grader/judge-call.ts judgeSystemPrompt appends the house suffix (the verdict v2
#                      format alone), so text in an entry addressed to the judge is part of the game, as the rules say
#   judge/anchors/     four 512x512 PNGs, weak to strong, played in every heat
#   ladder/            the dev phase's calibrated ladder (harness.judge.ladder, below): calibration.json, the house's
#                      calibration heat over the four anchors and the three rungs, and rungs/r1.png, r2.png and r3.png,
#                      the reference images; only a provisional heat reads it, never the final, and the final kit
#                      reveals it whole beside judge/
#   starter/           a working entry laid out as an entrant's repository (entry.png, a main.ts that copies it to
#                      /output/entry.png, and coolest-art-01's MIT LICENSE), which every kit carries as starter/
#                      (server/competitions/kit-dirs.ts KIT_STARTER_DIR): its entry.png is a pixel-art globe and
#                      newspaper with no story in it
#
# The house images (the anchors, the rungs and the starter) were drawn by the house at about 09:30Z on 13 November with
# gpt-image-2.5-flare (image-gen MCP) at 1024x1024, quality high, and scaled with Lanczos3 to 512x512 PNGs, early in
# the day and before it had ended anywhere, from the stories the house read reported by about 09:20Z, so they cover
# only the start of the day, and the rules say so. Its sources, BBC World (https://feeds.bbci.co.uk/news/world/rss.xml)
# and Al Jazeera (https://www.aljazeera.com/xml/rss/all.xml), each story first reported on 13 November (GMT): Nvidia's
