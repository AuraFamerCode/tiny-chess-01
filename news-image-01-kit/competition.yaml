# reference images, 24 calls (25 with the room), about $0.78 for a 1024x1024 entry, every request priced at the dearest
# pair the entry, the anchors and the 512x512 reference images make. No cap holds a heat: house judging has no spend cap
# (.cosmos/rules/grading.mdc), so max_total_usd 75 and dev_daily_usd 25, coolest-art-01's, are keys the contract
# requires and no heat reads (grader/worker.ts), and every dev heat plays all its rounds; the rules name no cap.
#
# The live feed (leaderboard.feed): from the moment an entry is judged during development its image shows on the page's
# Feed to everyone, beside its entrant's handle and its current provisional rank, and stays shown; a source bundle does
# not keep it out. The rules say so, as coolest-art-01's do.
#
# The money: $250 in placement prizes over a hundred places, a new hundred-place table, $50 / $20 / $10, then $5 each
# for 4th to 10th place and $1.50 each for 11th to 100th, one place per entrant (the owner: "$250 bounties, where the
