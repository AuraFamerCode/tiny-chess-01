# hackers' $400m crypto theft through fake video calls, https://www.bbc.co.uk/news/articles/cqdj1ellpd70o; a US record
# of 483,200 deportations in 2026,
# https://www.aljazeera.com/news/2026/11/13/us-reports-record-number-of-deportations-and-arrests-in-2026; Harry Kane
# breaks England's caps record,
# https://www.aljazeera.com/sports/2026/11/13/harry-kane-england-appearance-record-126-croatia-nations-league-quarterfinals.
# Each image from its prompt:
#   judge/anchors/1-weak.png    "A flat grey blob on a plain white background. A single flat mid-grey shape with soft
#                               lumpy edges, no outline, no shading, no texture, no detail of any kind. Crude and
