# server/competitions/grading-budget.ts put this bundle's final at 2,000 entries at 2.86 h expected (grades 0.93 h, the
# judge heat's 22326 calls 1.94 h) and 3.79 h at worst, within its 4 h and 12 h budgets, so 8 hours holds its worst case
# twice over, with room for a heat that shares the judge pool with another final; the final leaderboard is published
# within 1 day of the deadline, unless a check holds it. Kept at 8 hours (the same call for all three of the owner's
# 2026-11-13 image contests), read against the field coolest-art-01 and cutest-picture-01 drew (4,936 and 4,882
# submissions, production's API at 2026-11-13T10:34Z): a heat of about 4,800 entries plans 39,126 calls (6 Swiss rounds
# of 4,804 calls with the anchors, then the 10,302-call playoff), and at about 47 s a call under load (the router's
# answers of 2026-11-13, p95 120 s), on its share of JUDGE_POOL_BUDGET's 96 sends beside the other two finals (64 alone,
# 48 beside one, 32 beside two: grader/worker.ts judgePoolShares), this one may take about 11 hours, past its phase's
# end. That end decides nothing for a judged final: the automation job publishes once the heat and the checks after it
# are done, at whatever hour (server/competitions/lifecycle/auto.ts); the deployed escrow program takes post_result from
# the entries deadline, not from final_end (server/chain/jobs/post-result.ts: cutest-cat-01, ai-joke-02 and
